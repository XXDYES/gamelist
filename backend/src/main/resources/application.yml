spring:
  application:
    name: gamelist
  # 1. 数据库连接 URL
  #    数据库 test，地址 localhost:3306
  #    UTF-8 编码，不使用 SSL，时区 Asia/Shanghai
  datasource:
    url: "jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&enabledTLSProtocols=TLSv1.2"
    # 2. 数据库用户名：root
    username: root
    # 3. 数据库密码
    password: ${DB_PASSWORD}
    # 4. MySQL 8.0+ 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据源类型：Druid
    type: com.alibaba.druid.pool.DruidDataSource

# 服务端口
server:
  port: 8081

# JWT 密钥：从环境变量 JWT_SECRET 读取（至少 32 字节），不在源码/配置中写死
app:
  jwt:
    secret: ${JWT_SECRET}

# MyBatis-Plus 配置：控制台打印 SQL
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: org.example.gamelist.entity
  #global-config:
  #  db-config:
  #    insert-strategy: ignored
  #    update-strategy: ignored
  #    select-strategy: ignored

# AI 配置
ai:
  api:
    url: https://api.deepseek.com/chat/completions
    key: ${APIKEY_GAME}
    model: deepseek-flash
    max-tokens: 6000
    temperature: 0.3

rest:
  template:
    connect-timeout: 5000
    read-timeout: 20000

# 日志级别：root 是全局，org.example 是你们项目的包
logging:
  level:
    root: info
    org.example: debug
  # 输出到文件（文件名可自定义，放在项目 logs 目录）
  file:
    name: logs/gamelist.log
  # 日志文件格式（控制台使用 Spring Boot 默认彩色格式）
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"
  # 文件编码（避免中文乱码）
  charset:
    file: UTF-8
  # 文件滚动策略：单文件最大 10MB，保留最近 30 天，总容量上限 500MB
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
